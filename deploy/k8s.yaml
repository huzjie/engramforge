apiVersion: apps/v1
kind: Deployment
metadata:
  name: engramforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: engramforge
  template:
    metadata:
      labels:
        app: engramforge
    spec:
      containers:
        - name: engramforge
          image: engramforge:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: ENGRAMFORGE_BACKEND
              value: "mock"
---
apiVersion: v1
kind: Service
metadata:
  name: engramforge
spec:
  selector:
    app: engramforge
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
