replicaCount: 2

image:
  repository: engramforge
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

engram:
  tableSize: 65536
  embeddingDim: 256
  numHashes: 4
  offload: true

moe:
  numExperts: 8
  topK: 2

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi
